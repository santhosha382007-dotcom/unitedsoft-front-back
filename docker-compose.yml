version: '3.8'

services:
  unistaff-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unistaff-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=unistaff-super-secret-jwt-key-2026-production
    volumes:
      # Persistent storage for SQLite database on host VPS
      - ./backend/data:/app/data
